appId: com.studytracker.app
productName: Study Tracker
copyright: Copyright © 2026 Luis Eduardo

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - node_modules/@prisma/client/**/*
  - from: node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'

asarUnpack:
  - '**/*.node'
  - node_modules/.prisma/**/*
  - node_modules/@prisma/client/**/*

extraResources:
  - from: prisma
    to: prisma
    filter:
      - '**/*'
  - from: build/icon.png
    to: build/icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Study Tracker

mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.productivity

linux:
  target: AppImage
  icon: build/icon.png
  category: Office
